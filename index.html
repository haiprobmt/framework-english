<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameWork English</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Sentence frames, pronunciation and an AI conversation partner for professional English.">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=Andika&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky top bar, single 1120px workspace; library in three situation columns. */
  --paper:#F2F3EF; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6470; --line:#D8DCD5;
  --accent:#1E5A87; --accent-ink:#FFFFFF;
  --s0:#2F6F9F; --s1:#B5562F; --s2:#3E7D52; --s3:#8A4F7D; --s4:#9A7300;
  --good:#2E7D4F; --warn:#A86A00; --bad:#B23B3B;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --frame:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --ipa:'Andika','Charis SIL','Doulos SIL','Noto Sans','Segoe UI','Lucida Sans Unicode',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F151B; --surface:#18212A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2B3641;
    --accent:#7DB4E0; --accent-ink:#0F151B;
    --s0:#7FB3DD; --s1:#E8916C; --s2:#7FC092; --s3:#CF95C2; --s4:#DDB84A;
    --good:#6CC28F; --warn:#E0A84A; --bad:#EE7B7B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151B; --surface:#18212A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2B3641;
  --accent:#7DB4E0; --accent-ink:#0F151B;
  --s0:#7FB3DD; --s1:#E8916C; --s2:#7FC092; --s3:#CF95C2; --s4:#DDB84A;
  --good:#6CC28F; --warn:#E0A84A; --bad:#EE7B7B; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px max(16px,calc((100% - 1120px)/2));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font:800 22px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand b{color:var(--accent);font-weight:800}
.top nav{display:flex;gap:2px;flex-wrap:wrap}
.top nav a{padding:7px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.top nav a:hover{color:var(--ink)}
.top nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--warn);color:var(--surface);font:700 11px/1 var(--body)}
.badge:empty{display:none}
.sync{margin-left:auto;font-size:13px;color:var(--muted)}

main{max-width:1120px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:28px}
h1{font:800 clamp(32px,5vw,54px)/1.03 var(--display);letter-spacing:-.03em;margin:0}
.eyebrow{font:600 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lede{max-width:60ch;color:var(--muted);font-size:17px;margin:14px 0 0}

/* hero */
.hero{display:grid;grid-template-columns:5fr 7fr;gap:32px;align-items:center}
.hero-demo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.demo-cap{margin:14px 0 0;font-size:13px;color:var(--muted)}

/* frames */
.frame{font:400 20px/1.8 var(--frame);margin:16px 0 0}
.frame-big{font-size:clamp(21px,2.4vw,28px);line-height:1.65}
.seg{background-image:linear-gradient(var(--c),var(--c));background-repeat:no-repeat;background-position:0 100%;background-size:100% 3px;padding-bottom:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.frame-big .seg{background-size:100% 4px;animation:draw .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d) * 170ms + 150ms)}
@keyframes draw{from{background-size:0% 4px}to{background-size:100% 4px}}
@media (prefers-reduced-motion: reduce){.frame-big .seg{animation:none}}
.num{font:700 .5em/1 var(--body);color:var(--c);margin-right:3px;vertical-align:.9em}
.slot{font:500 .74em/1 var(--body);color:var(--c,var(--accent));border:1px dashed var(--c,var(--accent));border-radius:4px;padding:.18em .4em;vertical-align:.08em;white-space:nowrap}
.frame-inline{font-family:var(--frame)}

/* pronunciation: each word stacked over its IPA */
.w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.2;margin:0 0 .45em;cursor:pointer;border-radius:4px}
.w:hover .wt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.w.playing{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wi{font:400 .66em/1.35 var(--ipa);color:var(--c,var(--accent));letter-spacing:.01em;white-space:nowrap;margin-top:.1em}
.wi .st{color:var(--ink);font-weight:700}
.w.weak .wi{opacity:.6}
.pr-on .seg{background-image:none;padding-bottom:0}
.pr-on .frame{line-height:1.5}
.pr-on .frame .slot,.pr-on .lv .slot{vertical-align:top;margin-top:.15em;display:inline-block}
.pr-on .frame-big{line-height:1.35}
.pr-on .lv p,.pr-on .alts li,.pr-on .improved{line-height:1.4}
.pr-on .improved{font-size:17px}
.ipa-toggle{font:600 13px/1 var(--body);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.ipa-toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.ipa-toggle .sw{width:24px;height:14px;border-radius:7px;background:var(--line);position:relative}
.ipa-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--surface);transition:left .15s}
.ipa-toggle[aria-pressed="true"] .sw{background:var(--accent)}
.ipa-toggle[aria-pressed="true"] .sw::after{left:12px}
/* AI partner */
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg-ctl{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg-ctl button{font:600 14px/1.2 var(--body);padding:11px 12px;background:var(--surface);color:var(--muted);border:0;cursor:pointer}
.seg-ctl button + button{border-left:1px solid var(--line)}
.seg-ctl button[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--ink)}
.mipa{font-family:var(--ipa);color:var(--accent);font-size:.92em}
.mipa .st{color:var(--ink);font-weight:700}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.scen-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.scen{width:100%;height:100%;text-align:left;display:flex;flex-direction:column;gap:5px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.scen:hover{border-color:var(--accent)}
.scen.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.scen .tt{font:700 16px/1.25 var(--display)}
.scen-who{font-size:13.5px}
.scen-goal{font-size:14px;line-height:1.4}
.scen-cards{font:600 11.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-top:auto;padding-top:6px}
.chat-head .h2{font:700 clamp(22px,3vw,30px)/1.15 var(--display);margin:0;letter-spacing:-.01em}
.chat-title{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 22px/1 var(--display)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.frames-help{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.frames-help summary{cursor:pointer;font-weight:600;font-size:14px}
.fh{margin-top:10px}
.fh a{text-decoration:none}
.fh p{margin:4px 0 0;font-size:16px}
.chat{display:flex;flex-direction:column;gap:18px;padding:4px 0}
.msg{display:flex;flex-direction:column;gap:6px;max-width:min(720px,92%)}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{font:700 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bubble{padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.bubble p{margin:0}
.msg.partner .bubble{border-top-left-radius:4px}
.msg.partner .bubble p{font-size:18px;line-height:1.5}
.msg.me .bubble{border-top-right-radius:4px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:transparent}
.msg.me .bubble p{font-size:17px}
.msg-tools{display:flex;gap:6px}
.typing{display:flex;gap:5px;align-items:center;min-height:46px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.typing span{animation:none;opacity:.6}}
.fbk{align-self:stretch;width:100%;max-width:720px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:4px 12px 12px 12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.fbk.err{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.fbk p{margin:0}
.praise{color:var(--good);font-weight:500}
.lab{display:block;font:700 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.ok-lab{color:var(--good);margin:0}
.nat p{font-size:17px;line-height:1.5;margin:0 0 8px}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.issues s{color:var(--muted)}
.tag{display:inline-block;font:700 10.5px/1 var(--body);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-radius:5px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);vertical-align:1px}
.ptips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.ptips .chip{cursor:pointer}
.frame-link{font-size:14px;font-weight:600;text-decoration:none}
.composer{position:sticky;bottom:12px;display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 8px 24px -12px rgba(0,0,0,.25)}
.composer textarea{flex:1;border:0;background:transparent;padding:8px;resize:none;min-height:48px}
.composer textarea:focus{outline:none}
.composer:focus-within{border-color:var(--accent)}
.report .vocab td{font-size:15px}
a.chip{text-decoration:none}
a.chip:hover{border-color:var(--accent)}
/* phone app: microphone, read-aloud check, settings */
.mic{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;align-self:center}
.mic .mic-ico{width:24px;height:24px}
.mic.listening{background:var(--bad);color:#fff;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion: reduce){.mic.listening{animation:none}}
.composer{flex-wrap:wrap}
.composer .mic-status{flex-basis:100%;margin:0;padding:0 4px 2px;font-size:13px;color:var(--muted);min-height:0}
.composer .mic-status:empty{display:none}
.mic-btn .mic-ico,.sayit .mic-ico{width:16px;height:16px}
.mic-btn.listening,.sayit.listening{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.sayres{margin-top:10px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);max-width:720px}
.say-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.diff{font:400 18px/1.8 var(--frame);margin:0}
.dw{padding:1px 3px;border-radius:4px}
.dw.close{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.dw.miss{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);font-weight:500;text-decoration:underline dotted;text-underline-offset:4px}
.ins{color:var(--muted);font:400 .78em/1 var(--body)}
.field{width:100%;font:16px/1.4 var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.row .field{flex:1;min-width:0;width:auto}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.set-msg{margin:12px 0 0;font-size:14.5px;color:var(--muted)}
.set-msg.good{color:var(--good);font-weight:600}
.set-msg.bad{color:var(--bad);font-weight:600}
.steps-ol{list-style:decimal;padding-left:22px}
.install-btn{border-color:var(--accent);color:var(--accent)}
p.err{color:var(--bad)}
@media (max-width: 720px){
  .top{gap:8px 10px;padding:8px 12px}
  .brand{font-size:20px}
  .top nav{order:5;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
  .top nav::-webkit-scrollbar{display:none}
  .top nav a{white-space:nowrap;font-size:14px;padding:6px 9px}
  #voice-btn-name{display:none}
  main{padding:18px 12px 90px;gap:20px}
  .panel{padding:16px}
  .composer{bottom:8px}
  .msg{max-width:100%}
}
/* phrases */
.lv-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv-chip{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.lv-chip:hover{border-color:var(--accent)}
.lv-chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.lv-big{font:800 24px/1 var(--display)}
.lv-sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.lv-bar{display:block;width:100%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lv-bar span{display:block;height:100%;background:var(--good)}
.phr-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.phr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.phr-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phr-ph{font:700 18px/1.2 var(--display)}
.phr-m{margin:0;color:var(--muted);font-size:14.5px}
.phr-ex{margin:0;font-size:17px;line-height:1.5}
.pr-on .phr-ex{line-height:1.35}
mark.hl{background:color-mix(in srgb,var(--accent) 15%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.pill.k-c{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.pill.k-p{background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)}
.m-dots{display:inline-flex;gap:3px;margin-left:auto}
.m-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.m-dots i.on{background:var(--good)}
.phr-miss{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.use-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.use-list li{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:20px}
.promo{display:flex;gap:16px;align-items:center;flex-wrap:wrap;text-decoration:none;color:var(--ink)}
.promo:hover{border-color:var(--accent)}
.promo .h3{margin:0 0 4px}
@media (max-width: 720px){ .lv-row{grid-template-columns:1fr 1fr} .phr-list{grid-template-columns:1fr} }
/* natural english */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font:600 14px/1.2 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.reg-casual{background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--s2)}
.pill.reg-neutral{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.pill.reg-formal{background:color-mix(in srgb,var(--s0) 16%,transparent);color:var(--s0)}
.phr-ex2{margin:2px 0 0;font-size:15.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.icon-btn{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:10px;display:inline-grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
.stiff{font:400 19px/1.5 var(--frame);margin:0;padding:10px 14px;border-left:3px solid var(--muted);background:color-mix(in srgb,var(--muted) 7%,var(--surface));border-radius:0 9px 9px 0;color:var(--muted)}
@media (max-width: 720px){ .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px} .fchips::-webkit-scrollbar{display:none} .fchip{white-space:nowrap} }
#voice-btn{margin-left:0}
#voice-btn-name{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-panel{flex-basis:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:620px;margin-left:auto}
.voice-panel select{flex:1;min-width:0;font:15px/1.3 var(--body);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);margin:14px 0 0;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.legend b{font-family:var(--ipa);color:var(--ink);font-size:15px}
.legend .wk{font-family:var(--ipa);opacity:.6;color:var(--accent)}
.listen{display:flex;gap:6px;flex-wrap:wrap}

.strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.strip li{display:flex;align-items:center;gap:7px;font:600 13px/1 var(--body);padding:5px 11px 5px 5px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.strip .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--surface);font-size:11px}

/* today */
.today{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:stretch}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
a.stat:hover{border-color:var(--accent)}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500}
.today .btn{align-self:stretch;justify-content:center;padding:14px 20px}

/* library */
.library{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.group h2{font:700 24px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.group > p{margin:4px 0 0;font-size:14px}
.tiles{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.tile{display:grid;grid-template-columns:40px 1fr;column-gap:12px;row-gap:5px;padding:12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.letter{grid-row:1 / 3;display:grid;place-items:center;width:40px;height:40px;border-radius:9px;background:var(--ink);color:var(--paper);font:800 19px/1 var(--display)}
.letter.big{width:64px;height:64px;font-size:34px;border-radius:13px;flex:none}
.tt{font-weight:600;line-height:1.3}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fix{font-size:12px;color:var(--muted)}
.pill{font:700 10.5px/1 var(--body);padding:4px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pill.new{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.pill.started{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.due{background:var(--warn);color:var(--surface)}
.pill.sched{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.lvl-basic{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.lvl-ok{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.lvl-professional{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}

/* panels and card view */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.h3{font:700 19px/1.2 var(--display);margin:0 0 12px}
.h4{font:700 12px/1.3 var(--body);margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.card-head{display:flex;gap:18px;align-items:center}
.card-head h1{font-size:clamp(28px,4vw,42px)}
.card-head .eyebrow{margin-bottom:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:-8px}
.tabs button{font:600 15px/1 var(--body);background:none;border:0;padding:12px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs button span{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1.5px solid currentColor;font-size:11px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#pane{display:flex;flex-direction:column;gap:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.frame-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.alts ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.vocab{width:100%;border-collapse:collapse}
.vocab td,.vocab th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.vocab tr:last-child td{border-bottom:0}
.vocab th{font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.vocab s{color:var(--muted)}
.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lv{border-radius:11px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.lv-name{font:700 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.07em}
.lv0 .lv-name{color:var(--bad)} .lv1 .lv-name{color:var(--warn)}
.lv2{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.lv2 .lv-name{color:var(--good)}
.lv p{font-family:var(--frame);margin:0;flex:1}
.next-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{font:600 15px/1 var(--body);padding:11px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.btn.ghost{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ai-only{display:none !important}
.has-ai .ai-only{display:inline-flex !important}
.no-ai-note{font-size:13px}
.has-ai .no-ai-note{display:none}

/* drills */
.dots{display:flex;gap:6px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.dot{width:24px;height:5px;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)} .dot.cur{background:var(--ink)}
.dots .muted{margin-left:8px;font-size:13px}
.qtype{font:700 12px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:0 0 10px}
.qtext{font-size:20px;line-height:1.6;margin:0 0 18px;max-width:62ch}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);color:transparent;line-height:1.1}
.opts{display:flex;flex-direction:column;gap:8px;max-width:620px}
.opt{text-align:left;font:500 16px/1.35 var(--body);padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.serif{font-family:var(--frame)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px/1.2 var(--body);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.slots{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1.5px dashed var(--line);border-radius:11px;margin-bottom:12px}
.chip.placed{background:color-mix(in srgb,var(--accent) 13%,var(--surface));border-color:transparent}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:transparent}
.qfb{margin-top:18px;padding-left:12px;border-left:3px solid transparent}
.qfb:empty{display:none}
.qfb.ok{border-left-color:var(--good)} .qfb.ok b{color:var(--good)}
.qfb.no{border-left-color:var(--bad)} .qfb.no b{color:var(--bad)}
.done-score{font:800 56px/1 var(--display);letter-spacing:-.03em;margin:4px 0 8px}

/* practise */
.task{font:500 19px/1.5 var(--body);margin:0 0 16px;max-width:65ch}
details.ref{border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:18px}
details.ref summary{cursor:pointer;font-weight:600;font-size:14px}
details.ref .strip{margin-top:12px}
details.ref .frame{font-size:17px;margin-top:10px}
.lbl{display:block;font-weight:600;margin-bottom:6px}
.lbl .muted{font-weight:400}
textarea{width:100%;font:17px/1.6 var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.spacer{flex:1}
#fb{display:flex;flex-direction:column;gap:16px}
#fb:empty{display:none}
.fb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.fb-head .h3{margin:0}
.score{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.metrics{display:flex;gap:28px;margin:4px 0 14px;flex-wrap:wrap}
.metrics .k{display:block;font-size:12px;color:var(--muted)}
.metrics .v{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.steps-check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.steps-check li{padding:8px 12px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface));border-radius:0 8px 8px 0}
.steps-check li.miss{border-left-style:dashed;background:transparent}
.mark{display:inline-block;width:18px;font-weight:700}
.steps-check .ok .mark{color:var(--good)} .steps-check .miss .mark{color:var(--muted)}
q{font-family:var(--frame);font-style:italic}
.improved{font:400 18px/1.65 var(--frame);margin:0 0 10px;padding:14px 18px;border-left:4px solid var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface));border-radius:0 11px 11px 0}
.note{padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--warn) 13%,var(--surface));margin:14px 0 0}
.err{padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.rate p{margin:0 0 4px}

/* review + radar */
.page-head h1{font-size:clamp(30px,4.4vw,46px)}
.rlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:11px}
.rrow .letter{grid-row:auto}
.rrow .tt{display:block}
.empty{padding:28px 22px;text-align:left}
.bars{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:110px 1fr 44px;gap:4px 12px;align-items:center}
.bar-track{height:10px;border-radius:5px;background:color-mix(in srgb,var(--line) 60%,transparent)}
.bar{height:10px;border-radius:5px;background:var(--warn)}
.bar.neutral{background:var(--muted)}
.bar-row .w{font-weight:600}
.bar-row .n{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.ups{grid-column:2 / 4;font-size:13.5px;color:var(--muted)}
.ups b{color:var(--ink);font-weight:600}
.chart{width:100%;height:auto;display:block}
.ch-bar{fill:var(--accent)} .ch-last{fill:var(--ink)}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-target{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.ch-txt{fill:var(--muted);font:12px var(--body)}
.ch-tgt{fill:var(--good);font:600 12px var(--body)}
.attempts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.attempts li{border-bottom:1px solid var(--line);padding-bottom:10px}
.attempts li:last-child{border-bottom:0}
.attempts .t{font-family:var(--frame);margin:4px 0 0}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;font-size:14px}
.pager a{text-decoration:none}

@media (max-width: 900px){
  .hero{grid-template-columns:1fr;gap:20px}
  .library{grid-template-columns:1fr}
  .today{grid-template-columns:repeat(3,1fr)}
  .today .btn{grid-column:1 / -1}
}
@media (max-width: 720px){
  .two,.dial{grid-template-columns:1fr}
  .today{grid-template-columns:1fr 1fr}
  .sync{display:none}
  #voice-btn{margin-left:auto}
  .card-head .letter.big{width:52px;height:52px;font-size:28px}
  .bar-row{grid-template-columns:90px 1fr 36px}
}
</style>

function wordsOf(text){ return (text.toLowerCase().replace(/[’‘]/g, "'").match(/[a-z]+(?:'[a-z]+)?/g) || []); }
function analyze(c, text){
  const lower = " " + text.toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, " ") + " ";
  const ws = wordsOf(text);
  const wc = ws.length;
  const sents = text.split(/[.!?]+/).filter(s => s.trim().split(/\s+/).filter(Boolean).length >= 2);
  const sc = Math.max(sents.length, wc ? 1 : 0);
  const steps = c.steps.map((name, i) => {
    const cues = c.cues[i] || [];
    const hit = cues.length ? cues.find(cue => lower.includes(cue)) : (wc >= 15 ? "(content)" : null);
    return {name, ok:!!hit, cue:hit || ""};
  });
  const counts = {};
  ws.forEach(w => { if(STOP.has(w) || (w.length < 3 && !BASIC[w])) return; counts[w] = (counts[w] || 0) + 1; });
  const repeated = Object.entries(counts).filter(([w, n]) => n >= 3 || (n >= 2 && BASIC[w])).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([w, n]) => ({w, n}));
  const rset = new Set(repeated.map(r => r.w));
  const basic = Object.keys(BASIC).filter(w => w !== "lot" && counts[w] && !rset.has(w));
  if(/\ba lot\b/.test(lower) && !rset.has("lot")) basic.push("lot");
  return {wc, sc, avg: sc ? Math.round(wc / sc) : 0, steps, stepsOk: steps.filter(s => s.ok).length, repeated, basic, fillers: countFillers(lower)};
}
function stepHint(c, i){ return plain(c.frame.filter(f => f[0] === i).map(f => f[1]).join("").trim()); }
const label = w => w === "lot" ? "a lot" : w;

/* drills */
function buildDrill(c){
  const qs = [{type:"order", shuffled: (() => { let s; do { s = shuffle(c.steps.map((_, i) => i)); } while(s.every((v, k) => v === k) && c.steps.length > 1); return s; })()}];
  c.gaps.forEach(g => qs.push({type:"gap", g, opts:shuffle([g.a, ...g.o])}));
  const pool = [];
  CARDS.forEach(o => o.vocab.forEach(v => { if(o.id !== c.id) pool.push(v[1].split(" / ")[0]); }));
  c.vocab.filter(v => !/\[/.test(v[1])).slice(0, 2).forEach(v => {
    const right = v[1].split(" / ")[0];
    const wrong = shuffle(pool.filter(x => x !== right && !/\[/.test(x))).slice(0, 2);
    qs.push({type:"vocab", v, right, opts:shuffle([right, ...wrong])});
  });
  qs.push({type:"level", opts:shuffle([0, 1, 2])});
  return qs;
}
function renderDrill(c, pane){
  let d = drills[c.id];
  if(!d){ d = drills[c.id] = {qs:buildDrill(c), i:0, score:0, answered:false, order:[]}; }
  if(d.i >= d.qs.length) return drillDone(c, pane, d);
  const q = d.qs[d.i];
  pane.innerHTML = `
  <section class="panel">
    <div class="dots" aria-hidden="true">${d.qs.map((_, k) => `<span class="dot ${k < d.i ? "done" : ""} ${k === d.i ? "cur" : ""}"></span>`).join("")}<span class="muted">Question ${d.i + 1} of ${d.qs.length}</span></div>
    <div id="q"></div>
    <div id="qfb" class="qfb" aria-live="polite"></div>
    <div class="next-row" style="margin-top:18px"><button class="btn primary" id="qnext" disabled>${d.i + 1 === d.qs.length ? "See result" : "Next question"} →</button></div>
  </section>`;
  const qEl = $("#q", pane), fb = $("#qfb", pane), nx = $("#qnext", pane);
  const finish = (ok, msg) => { if(d.answered) return; d.answered = true; if(ok) d.score++; fb.className = "qfb " + (ok ? "ok" : "no"); fb.innerHTML = msg; nx.disabled = false; nx.focus(); };
  nx.onclick = () => { d.i++; d.answered = false; d.order = []; renderDrill(c, pane); };
  const optHandler = (correct, msgOk, msgNo) => {
    qEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if(d.answered) return;
      const ok = b.dataset.o === correct;
      qEl.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x.dataset.o === correct) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      finish(ok, ok ? msgOk : msgNo);
    });
  };
  if(q.type === "order"){
    qEl.innerHTML = `<p class="qtype">Put the structure in order</p><p class="qtext">Click the steps in the order they come in the frame.</p><div class="slots" id="placed"></div><div class="chips" id="pool"></div>`;
    const draw = () => {
      $("#placed", qEl).innerHTML = d.order.length ? d.order.map((si, k) => `<span class="chip placed">${k + 1}. ${esc(c.steps[si])}</span>`).join("") : '<span class="muted">Your order appears here</span>';
      const left = q.shuffled.filter(si => !d.order.includes(si));
      $("#pool", qEl).innerHTML = left.map(si => `<button class="chip" data-si="${si}">${esc(c.steps[si])}</button>`).join("");
      $("#pool", qEl).querySelectorAll("button").forEach(b => b.onclick = () => {
        if(d.answered) return;
        d.order.push(+b.dataset.si); draw();
        if(d.order.length === c.steps.length){
          const ok = d.order.every((v, k) => v === k);
          finish(ok, ok ? "<b>Correct.</b> That's the full structure." : "<b>Not quite.</b> The order is " + c.steps.map((s, k) => (k + 1) + ". " + esc(s)).join(" → ") + ".");
        }
      });
    };
    draw();
  } else if(q.type === "gap"){
    const src = [frameText(c), ...c.alt].find(s => s.includes(q.g.a)) || frameText(c);
    const shown = slotify(src.replace(q.g.a, "§§")).replace("§§", '<span class="blank">_____</span>');
    qEl.innerHTML = `<p class="qtype">Complete the frame</p><p class="qtext frame-inline">${shown}</p><div class="opts">${q.opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    optHandler(q.g.a, `<b>Correct.</b> “${esc(q.g.a)}” is the natural phrase here.`, `<b>Not quite.</b> The answer is “${esc(q.g.a)}”.`);
  } else if(q.type === "vocab"){
    qEl.innerHTML = `<p class="qtype">Upgrade the word</p><p class="qtext">Which is a stronger alternative to “${esc(q.v[0])}” in this situation?</p><div class="opts">${q.opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    optHandler(q.right, `<b>Correct.</b> Upgrades for “${esc(q.v[0])}”: ${esc(q.v[1])}.`, `<b>Not quite.</b> Upgrades for “${esc(q.v[0])}”: ${esc(q.v[1])}.`);
  } else if(q.type === "level"){
    const names = ["Basic", "OK", "Professional"];
    qEl.innerHTML = `<p class="qtype">Level dial</p><p class="qtext">Which version sounds most professional?</p><div class="opts">${q.opts.map(i => `<button class="opt serif" data-o="${i}">${esc(c.level[i])}</button>`).join("")}</div>`;
    const expl = names.map((n, i) => `${n}: <i>${esc(c.level[i])}</i>`).join("<br>");
    optHandler("2", "<b>Correct.</b><br>" + expl, "<b>Not quite.</b><br>" + expl);
  }
}
function drillDone(c, pane, d){
  const p = P(c);
  if(!d.saved){ d.saved = true; p.drills++; p.best = Math.max(p.best, Math.round(100 * d.score / d.qs.length)); persist(); }
  pane.innerHTML = `
  <section class="panel">
    <p class="qtype">Drill complete</p>
    <p class="done-score">${d.score} / ${d.qs.length}</p>
    <p class="muted" style="margin:0 0 18px">${d.score === d.qs.length ? "Perfect. You know this frame. Now use it." : "Good practice. Run it again or go and use the frame in a scenario."} Best so far: ${p.best}%.</p>
    <div class="row"><button class="btn" id="again">Drill again</button><button class="btn primary" id="go-pr">Practise in a scenario →</button></div>
  </section>`;
  $("#again", pane).onclick = () => { drills[c.id] = null; renderDrill(c, pane); };
  $("#go-pr", pane).onclick = () => goTab(c, "practise");
}

      onDone:(t, send, conf, err) => { ta.value = t; drafts[c.id] = t; upd(); lsSet(LS_DRAFTS, drafts); prMic.classList.remove("listening"); prMic.setAttribute("aria-pressed", "false"); prMic.lastChild.textContent = "Speak"; if(err) wcEl.textContent = micErrText(err); }});

function saveAttempt(c, text, wc){
  const last = [...S.attempts].reverse().find(x => x.card === c.id);
  if(last && last.text === text) return;
  S.attempts.push({card:c.id, text, at:Date.now(), wc});
  S.attempts = S.attempts.slice(-80);
  P(c).practised++;
  persist();
}
function localHTML(c, a){

    <ul class="steps-check">${a.steps.map((s, i) => `<li class="${s.ok ? "ok" : "miss"}" style="--c:var(--s${i % 5})"><span class="mark">${s.ok ? "✓" : "–"}</span><b>${esc(s.name)}</b> <span class="muted">${s.ok ? (s.cue && s.cue !== "(content)" ? "· found “" + esc(s.cue.trim()) + "”" : "· present") : "· not found. Try: <i>" + esc(stepHint(c, i)) + "</i>"}</span></li>`).join("")}</ul>

    ${a.fillers.n ? `<h3 class="h4">Fillers</h3><div class="chips">${a.fillers.found.map(f => `<span class="chip warn">${esc(f.w)} ×${f.n}</span>`).join("")}</div>` : ""}

function nextBox(p, r){
  if(r === "hard") return 1;
  if(r === "good") return Math.min(6, Math.max(2, p.box + 1));
  return Math.min(6, Math.max(3, p.box + 2));
}
function rateHTML(c){
  const p = P(c);
  const d = r => INTERVALS[nextBox(p, r)];
  return `<section class="panel rate" id="rate">

    <p class="muted" style="margin-bottom:12px">Your rating sets when this card comes back for review.</p>

  </section>`;
}
function wireRate(c, root){
  root.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const p = P(c);
    p.box = nextBox(p, b.dataset.r);

  });
}

function parseJSON(t){
  if(t && typeof t === "object") return t;
  const s = String(t || ""); const i = s.indexOf("{"), j = s.lastIndexOf("}");
  if(i < 0 || j <= i) throw {code:"parse", message:"No JSON"};
  return JSON.parse(s.slice(i, j + 1));
}

/* ---------------- Claude API (key stored on this device only) ---------------- */
const KEY_LS = "framework-english-apikey", MODEL_LS = "framework-english-model";
const MODELS = [["claude-sonnet-5-5", "Claude Sonnet 5.5 · best feedback"], ["claude-haiku-5-5", "Claude Haiku 5.5 · fastest and cheapest"]];
const apiKey = () => { const k = lsGet(KEY_LS); return typeof k === "string" ? k : ""; };
const currentModel = () => { const m = lsGet(MODEL_LS); return MODELS.some(x => x[0] === m) ? m : MODELS[0][0]; };
async function claudeCall(prompt, opts){
  opts = opts || {};
  const key = apiKey();
  if(!key) throw {code:"no_key"};
  let res;
  try{
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", signal:opts.signal,
      headers:{"x-api-key":key, "anthropic-version":"2023-06-01", "content-type":"application/json", "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:opts.model || currentModel(), max_tokens:opts.maxTokens || 1600, stream:!!opts.onText, messages:[{role:"user", content:prompt}]})
    });
  }catch(e){ throw {code:"network", message:String(e && e.message || e)}; }
  if(!res.ok){
    let msg = ""; try{ const j = await res.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
    const code = res.status === 401 || res.status === 403 ? "bad_key" : res.status === 429 ? "rate_limited" : res.status === 529 || res.status >= 500 ? "overloaded" : /credit|billing/i.test(msg) ? "credit" : "api";
    throw {code, message:msg || ("HTTP " + res.status)};
  }
  if(!opts.onText){
    const j = await res.json();
    return {text:(j.content || []).filter(b => b.type === "text").map(b => b.text).join("")};
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf("\n\n")) >= 0){
      const evt = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = evt.split("\n").find(l => l.startsWith("data:"));
      if(!line) continue;
      let d; try{ d = JSON.parse(line.slice(5)); }catch(e){ continue; }
      if(d.type === "content_block_delta" && d.delta && d.delta.type === "text_delta"){ text += d.delta.text; try{ opts.onText(text); }catch(e){} }
      else if(d.type === "error") throw {code:d.error && d.error.type === "overloaded_error" ? "overloaded" : "api", message:(d.error && d.error.message) || "Stream error"};
    }
  }
  return {text};
}
function initSample(){
  sampleFn = apiKey() ? ((prompt) => claudeCall(prompt)) : null;

const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function n2w(n){
  if(n < 20) return [ONES[n]];
  if(n < 100) return [TENS[Math.floor(n / 10)], ...(n % 10 ? [ONES[n % 10]] : [])];
  if(n < 1000) return [ONES[Math.floor(n / 100)], "hundred", ...(n % 100 ? n2w(n % 100) : [])];
  if(n < 1e6) return [...n2w(Math.floor(n / 1000)), "thousand", ...(n % 1000 ? n2w(n % 1000) : [])];
  if(n < 1e9) return [...n2w(Math.floor(n / 1e6)), "million", ...(n % 1e6 ? n2w(n % 1e6) : [])];
  return String(n).split("");
}
function numW(s){ const [a, b] = String(s).split("."); const out = n2w(parseInt(a, 10)); if(b) out.push("point", ...b.split("").map(d => ONES[+d])); return out; }

const S_PRON = new Set(["it","that","what","there","here","he","she","who","where","how","let"]);

  if((m = p.match(/^([a-z]+)n't$/))) return [m[1], "not"];
  if((m = p.match(/^([a-z]+)'(re|ve|ll|d|m)$/))) return [m[1], {re:"are", ve:"have", ll:"will", d:"would", m:"am"}[m[2]]];
  if((m = p.match(/^([a-z]+)'s$/)) && S_PRON.has(m[1])) return [m[1], "is"];
  return [p];
}
function normTok(tok){
  const t = String(tok).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”"]/g, "").replace(/(\d),(?=\d{3}\b)/g, "$1");
  const out = [];
  t.split(/[-–—\/]+/).forEach(p => {
    p = p.replace(/^[^a-z0-9$]+/, "").replace(/[^a-z0-9%]+$/, "");
    if(!p) return;
    let m;
    if((m = p.match(/^\$(\d+(?:\.\d+)?)$/))){ out.push(...numW(m[1]), "dollars"); return; }
    if((m = p.match(/^(\d+(?:\.\d+)?)%$/))){ out.push(...numW(m[1]), "percent"); return; }
    if((m = p.match(/^(\d+)(st|nd|rd|th)$/))){ out.push(...ordinal(n2w(+m[1]))); return; }
    if(/^\d+(\.\d+)?$/.test(p)){ out.push(...numW(p)); return; }
    if(p === "ok") p = "okay";
    out.push(...expandContr(p.replace(/%/g, "")));
  });
  return out.filter(Boolean);
}
function lev(a, b){ const m = a.length, n = b.length; let prev = Array.from({length:n + 1}, (_, j) => j); for(let i = 1; i <= m; i++){ const cur = [i]; for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
function eqW(a, b){ if(a === b) return 2; if(a.length >= 4 && b.length >= 4 && Math.abs(a.length - b.length) <= 1 && lev(a, b) <= 1) return 1; return 0; }
function align(R, H){
  const n = R.length, m = H.length, dp = Array.from({length:n + 1}, () => new Int32Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--){ const e = eqW(R[i], H[j]); dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1], e ? dp[i + 1][j + 1] + e : 0); }
  const ops = []; let i = 0, j = 0;
  while(i < n && j < m){ const e = eqW(R[i], H[j]); if(e && dp[i][j] === dp[i + 1][j + 1] + e){ ops.push({t:e === 2 ? "ok" : "close", i, j}); i++; j++; } else if(dp[i + 1][j] >= dp[i][j + 1]){ ops.push({t:"miss", i}); i++; } else { ops.push({t:"extra", j}); j++; } }
  while(i < n) ops.push({t:"miss", i: i++}); while(j < m) ops.push({t:"extra", j: j++});
  return ops;
}
function grade(refText, hypText){
  const rOrig = String(refText).replace(/\[[^\]]*\]/g, " ").split(/\s+/).filter(Boolean);
  const R = [], owner = [];
  rOrig.forEach((tok, k) => normTok(tok).forEach(s => { R.push(s); owner.push(k); }));
  const H = []; String(hypText).split(/\s+/).filter(Boolean).forEach(t => H.push(...normTok(t)));
  const ops = align(R, H), stat = {}, heardAs = {};
  let hits = 0;
  ops.forEach((o, x) => {
    if(o.t === "miss"){ stat[owner[o.i]] = "miss"; }
    else if(o.t === "ok" || o.t === "close"){ hits++; const k = owner[o.i]; if(stat[k] !== "miss") stat[k] = o.t === "close" ? "close" : (stat[k] || "ok"); }
    else { let y = x - 1; while(y >= 0 && ops[y].t === "extra") y--; if(y >= 0 && ops[y].t === "miss"){ const k = owner[ops[y].i]; (heardAs[k] = heardAs[k] || []).push(H[o.j]); } }
  });
  return {rOrig, stat, heardAs, hits, total:R.length, acc:R.length ? Math.round(100 * hits / R.length) : 0};
}
const coreOf = tok => String(tok).toLowerCase().replace(/’/g, "'").replace(/^[^a-z0-9]+/, "").replace(/[^a-z0-9%']+$/, "").replace(/'$/, "");
function sayResultHTML(g, conf){
  const missed = [...new Set(g.rOrig.filter((t, k) => g.stat[k] === "miss").map(coreOf).filter(Boolean))];
  const head = g.acc >= 95 ? "Clear. Every word was recognised." : g.acc >= 75 ? "Good. A few words weren't recognised." : "Some words weren't recognised. Listen and try again.";
  return `<div class="say-head"><b>${head}</b><span class="score">${g.acc}%</span></div>
    <p class="diff">${g.rOrig.map((tok, k) => { const st = g.stat[k] || "ok"; const ha = g.heardAs[k] ? ` <s class="ins" title="What the recogniser heard">${esc(g.heardAs[k].join(" "))}</s>` : ""; return `<span class="dw ${st}">${esc(tok)}</span>${ha}`; }).join(" ")}</p>
    ${missed.length ? `<div class="chips" style="margin-top:10px">${missed.slice(0, 10).map(w => `<button class="chip speak" data-say="${esc(w)}" data-rate="0.85">${esc(w)}${PRON.ipa[w] ? ` <span class="mipa">/${fmtIPA(PRON.weak[w] || PRON.ipa[w])}/</span>` : ""}</button>`).join("")}</div><p class="muted" style="font-size:13px;margin:8px 0 0">Tap a word to hear it. Crossed-out words show what the recogniser heard instead.</p>` : ""}
    ${conf ? `<p class="muted" style="font-size:13px;margin:6px 0 0">Recogniser confidence: ${Math.round(conf * 100)}%</p>` : ""}`;
}
function sayItCheck(btn){
  if(Mic.active && Mic.owner === btn){ micStop(true); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const host = btn.closest(".listen") || btn;
  let out = host.nextElementSibling;
  if(!out || !out.classList.contains("sayres")){ out = document.createElement("div"); out.className = "sayres"; out.setAttribute("aria-live", "polite"); host.after(out); }
  const label = btn.querySelector("span");
  const target = btn.dataset.target;
  out.innerHTML = '<p class="muted" style="margin:0">Listening… read the sentence aloud.</p>';
  btn.classList.add("listening"); if(label) label.textContent = "Stop";
  micStart({owner:btn, autoSendMs:1800, idleMs:12000,
    onUpdate:() => { if(Mic.owner === btn && (Mic.text || Mic.interim)) out.innerHTML = `<p class="muted" style="margin:0">Heard: <i>${esc((Mic.text + " " + Mic.interim).trim())}</i></p>`; },
    onDone:(t, send, conf, err) => {
      btn.classList.remove("listening"); if(label) label.textContent = "Say it";
      if(err){ out.innerHTML = `<p class="err" style="margin:0">${esc(micErrText(err))}</p>`; return; }
      if(!t){ out.innerHTML = '<p class="muted" style="margin:0">Nothing was heard. Tap Say it and read the sentence aloud.</p>'; return; }
      out.innerHTML = sayResultHTML(grade(target, t), conf);
      wireSpeak(out);
    }});
}
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".sayit"); if(b){ e.preventDefault(); sayItCheck(b); } });

const PHR = PHR_RAW.map((r, i) => ({id:r[0] + r[1] + i, lv:r[0], k:r[1], ph:r[2], m:r[3], ex:r[4], a:r[5], d:r[6]}));
const LEVELS = ["B1", "B2", "C1", "C2"];
const LEVEL_NOTE = {B1:"Everyday work English", B2:"Confident professional", C1:"Precise and natural", C2:"Sophisticated and idiomatic"};
const phrState = {lv:"B2", kind:"all", tab:"learn", quiz:null, use:null};
function PS(id){ const x = S.phr[id]; if(x && typeof x === "object") return x; return (S.phr[id] = {r:0, w:0, box:0, due:0}); }
const phrFiltered = () => PHR.filter(p => p.lv === phrState.lv && (phrState.kind === "all" || p.k === phrState.kind));
const isMastered = p => { const s = S.phr[p.id]; return !!(s && s.box >= 3); };
const phrDue = () => PHR.filter(p => { const s = S.phr[p.id]; return s && s.box > 0 && s.due <= Date.now(); });
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const blankRe = a => new RegExp("(^|[^A-Za-z])(" + reEsc(a).replace(/ /g, "\\s") + ")(?![A-Za-z])");
function blankedHTML(p){ return esc(p.ex.replace(blankRe(p.a), "$1§§")).replace("§§", '<span class="blank">_____</span>'); }
function exHTML(p){
  const m = p.ex.match(blankRe(p.a));
  if(!m) return pronHTML(p.ex);
  const i = m.index + m[1].length;
  return pronHTML(p.ex.slice(0, i)) + '<mark class="hl">' + pronHTML(m[2]) + "</mark>" + pronHTML(p.ex.slice(i + m[2].length));
}
const kindName = k => k === "c" ? "Collocation" : "Phrasal verb";
const dots3 = p => { const b = Math.min(3, (S.phr[p.id] || {}).box || 0); return `<span class="m-dots" title="${b >= 3 ? "Mastered" : b ? "Learning" : "New"}">${[0, 1, 2].map(i => `<i class="${i < b ? "on" : ""}"></i>`).join("")}</span>`; };

function phrLearn(items, pane){
  pane.innerHTML = `<ul class="phr-list">${items.map(p => `<li class="phr">
      <div class="phr-top"><b class="phr-ph">${esc(p.ph)}</b><span class="pill k-${p.k}">${kindName(p.k)}</span>${dots3(p)}</div>
      <p class="phr-m">${esc(p.m)}</p>
      <p class="frame-inline phr-ex">${exHTML(p)}</p>
      ${listenHTML(p.ex)}
    </li>`).join("")}</ul>
    <div class="next-row"><button class="btn primary" id="p-go-quiz">Test yourself on these →</button></div>`;
  $("#p-go-quiz", pane).onclick = () => { phrState.tab = "quiz"; phrState.quiz = null; renderPhrases(); window.scrollTo({top:0, behavior:"smooth"}); };
}
function buildPhrQuiz(items){
  const now = Date.now(), st = p => S.phr[p.id] || {box:0, due:0};
  const dueI = shuffle(items.filter(p => st(p).box > 0 && st(p).due <= now));
  const fresh = shuffle(items.filter(p => !st(p).box));
  const rest = items.filter(p => st(p).box > 0 && st(p).due > now).sort((a, b) => st(a).box - st(b).box);
  const pick = [...dueI, ...fresh, ...rest].slice(0, 10);
  return shuffle(pick).map(p => {
    if(Math.random() < 0.3){
      const others = shuffle(PHR.filter(o => o.id !== p.id && o.lv === p.lv && o.k === p.k)).slice(0, 2).map(o => o.m);
      return {p, type:"meaning", right:p.m, opts:shuffle([p.m, ...others])};
    }
    return {p, type:"gap", right:p.a, opts:shuffle([p.a, ...p.d])};
  });
}
function phrMark(p, ok){
  const s = PS(p.id);
  if(ok){ s.r = (+s.r || 0) + 1; s.box = Math.min(6, (+s.box || 0) + 1); }
  else { s.w = (+s.w || 0) + 1; s.box = 1; }
  s.due = Date.now() + INTERVALS[s.box] * DAY;
  persist();
}
function phrQuiz(items, pane){
  let q = phrState.quiz;
  if(!q || q.lv !== phrState.lv || q.kind !== phrState.kind) q = phrState.quiz = {lv:phrState.lv, kind:phrState.kind, qs:buildPhrQuiz(items), i:0, score:0, answered:false, missed:[]};
  if(!q.qs.length){ pane.innerHTML = '<div class="panel">No phrases here yet.</div>'; return; }
  if(q.i >= q.qs.length){
    pane.innerHTML = `<section class="panel"><p class="qtype">Round complete</p><p class="done-score">${q.score} / ${q.qs.length}</p>
      ${q.missed.length ? `<h3 class="h4">Review these</h3><ul class="phr-miss">${q.missed.map(p => `<li><b>${esc(p.ph)}</b> <span class="muted">· ${esc(p.m)}</span><br><span class="frame-inline">${esc(p.ex)}</span></li>`).join("")}</ul>` : '<p class="muted">Every answer right. These phrases will come back for review later.</p>'}
      <div class="row" style="margin-top:16px"><button class="btn" id="pq-again">Another round</button><button class="btn primary" id="pq-use">Use ${q.missed.length ? "the ones you missed" : "them"} in sentences →</button></div></section>`;
    $("#pq-again", pane).onclick = () => { phrState.quiz = null; renderPhrases(); };
    $("#pq-use", pane).onclick = () => { phrState.use = {items:(q.missed.length ? q.missed : q.qs.map(x => x.p)).slice(0, 3)}; phrState.tab = "use"; renderPhrases(); };
    return;
  }
  const cur = q.qs[q.i], p = cur.p;
  pane.innerHTML = `<section class="panel">
    <div class="dots" aria-hidden="true">${q.qs.map((_, k) => `<span class="dot ${k < q.i ? "done" : ""} ${k === q.i ? "cur" : ""}"></span>`).join("")}<span class="muted">Question ${q.i + 1} of ${q.qs.length}</span></div>
    ${cur.type === "gap"
      ? `<p class="qtype">${p.k === "c" ? "Complete the collocation" : "Complete the phrasal verb"}</p><p class="qtext frame-inline">${blankedHTML(p)}</p>`
      : `<p class="qtype">What does it mean?</p><p class="qtext"><b>${esc(p.ph)}</b></p>`}
    <div class="opts">${cur.opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="pqfb" class="qfb" aria-live="polite"></div>
    <div class="next-row" style="margin-top:18px"><button class="btn primary" id="pq-next" disabled>${q.i + 1 === q.qs.length ? "See result" : "Next question"} →</button></div>
  </section>`;
  const fb = $("#pqfb", pane), nx = $("#pq-next", pane);
  pane.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(q.answered) return;
    q.answered = true;
    const ok = b.dataset.o === cur.right;
    pane.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x.dataset.o === cur.right) x.classList.add("right"); });
    if(!ok){ b.classList.add("wrong"); q.missed.push(p); } else q.score++;
    phrMark(p, ok);
    fb.className = "qfb " + (ok ? "ok" : "no");
    fb.innerHTML = `<b>${ok ? "Correct." : "Not quite."}</b> <b>${esc(p.ph)}</b>: ${esc(p.m)}.<p class="frame-inline" style="margin:8px 0">${exHTML(p)}</p>${listenHTML(p.ex)}`;
    wireSpeak(fb);
    nx.disabled = false; nx.focus();
  });
  nx.onclick = () => { q.i++; q.answered = false; renderPhrases(); };
}
function usePrompt(items, text){
  return `You are an English coach for a C1-level professional. They are practising these ${items.length} expressions:
${items.map(p => `- "${p.ph}" (${kindName(p.k).toLowerCase()}, ${p.lv}): ${p.m}`).join("\n")}

They wrote or dictated (speech-to-text, so ignore punctuation and capitals):
"""${text}"""

For each expression, check whether they used it, and whether the form, grammar and meaning are correct and natural in context. Then rewrite the whole text naturally, using all the expressions correctly.
Return ONLY JSON with exactly this shape:
{"items":[{"phrase":"<expression>","used":true|false,"correct":true|false,"comment":"<max 20 words>","better":"<a corrected or model sentence using it>"}],
 "natural":"<the full text rewritten naturally by a native professional, same ideas>",
 "tip":"<one short tip>"}`;
}
function phrUse(items, pane){

    const weak = items.filter(p => { const s = S.phr[p.id]; return s && s.box > 0 && s.box < 3; });

  }

      onDone:(t, s, conf, err) => { ta.value = t; U.text = t; mic.classList.remove("listening"); mic.lastChild.textContent = "Speak"; if(err) out.innerHTML = `<div class="panel err">${esc(micErrText(err))}</div>`; }});
  };

    const text = ta.value.trim();

    if(Mic.active) micStop(false);
    const btn = $("#use-check", pane); btn.disabled = true;

    finally{ btn.disabled = false; }
  };
}
function useResultHTML(v){

const NAT = NAT_RAW.map((r, i) => ({id:"n" + i, cat:r[0], lv:r[1], pat:r[2], reg:r[3], use:r[4], exs:r[5], a:r[6], d:r[7], stiff:r[8], err:r[9]}));
const natState = {cat:"all", lv:"all", tab:"learn", quiz:null, tr:null};
function NS(id){ const x = S.nat[id]; if(x && typeof x === "object") return x; return (S.nat[id] = {r:0, w:0, box:0, due:0}); }
const natFiltered = () => NAT.filter(p => (natState.cat === "all" || p.cat === natState.cat) && (natState.lv === "all" || p.lv === natState.lv));
const natDue = () => NAT.filter(p => { const s = S.nat[p.id]; return s && s.box > 0 && s.due <= Date.now(); });
const natMastered = p => { const s = S.nat[p.id]; return !!(s && s.box >= 3); };
const catName = id => (NCATS.find(c => c[0] === id) || ["", id])[1];
function natMark(p, ok){
  const s = NS(p.id);
  if(ok){ s.r = (+s.r || 0) + 1; s.box = Math.min(6, (+s.box || 0) + 1); }
  else { s.w = (+s.w || 0) + 1; s.box = 1; }
  s.due = Date.now() + INTERVALS[s.box] * DAY;
  persist();
}
const natDots = p => { const b = Math.min(3, (S.nat[p.id] || {}).box || 0); return `<span class="m-dots" title="${b >= 3 ? "Mastered" : b ? "Learning" : "New"}">${[0, 1, 2].map(i => `<i class="${i < b ? "on" : ""}"></i>`).join("")}</span>`; };
const natEx = p => exHTML({ex:p.exs[0], a:p.a});
document.addEventListener("click", e => { if(e.target.closest && e.target.closest("[data-nat-quiz]")){ natState.tab = "quiz"; natState.quiz = null; } });

function renderNatural(){
  setNav("natural");
  const items = natFiltered();
  const due = natDue().length;
  app.innerHTML = `
  <header class="page-head"><p class="eyebrow">Sound like a native speaker</p><h1>Natural English</h1>
  <p class="lede">The small phrases and structures native speakers use all the time: to react, soften, buy time, link ideas and add emphasis. Learn when to use them, hear them, then say them yourself.</p></header>
  <section class="panel">
    <div class="fchips" role="radiogroup" aria-label="Category">${[["all", "All"], ...NCATS].map(([k, l]) => `<button class="fchip${natState.cat === k ? " on" : ""}" role="radio" aria-checked="${natState.cat === k}" data-ncat="${k}">${esc(l)}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px">
      <span class="seg-ctl" role="radiogroup" aria-label="Level">${["all", "B1", "B2", "C1", "C2"].map(l => `<button role="radio" aria-checked="${natState.lv === l}" data-nlv="${l}">${l === "all" ? "All levels" : l}</button>`).join("")}</span>
      <span class="spacer"></span>
      <span class="muted" style="font-size:14px">${NAT.filter(natMastered).length} / ${NAT.length} mastered</span>
      ${due ? `<span class="pill due">${due} due</span>` : ""}
    </div>
  </section>
  <div class="tabs" role="tablist">${[["learn", "Learn"], ["quiz", "Practise"], ["say", "Say it naturally"]].map(([k, l], i) => `<button role="tab" aria-selected="${natState.tab === k}" data-ntab="${k}"><span>${i + 1}</span>${l}</button>`).join("")}</div>
  <div id="npane" class="stack"></div>`;
  app.querySelectorAll("[data-ncat]").forEach(b => b.onclick = () => { natState.cat = b.dataset.ncat; natState.quiz = null; natState.tr = null; renderNatural(); });
  app.querySelectorAll("[data-nlv]").forEach(b => b.onclick = () => { natState.lv = b.dataset.nlv; natState.quiz = null; natState.tr = null; renderNatural(); });
  app.querySelectorAll("[data-ntab]").forEach(b => b.onclick = () => { natState.tab = b.dataset.ntab; renderNatural(); });
  const pane = $("#npane");
  if(!items.length){ pane.innerHTML = '<div class="panel">No patterns match these filters. Try another level.</div>'; return; }
  if(natState.tab === "learn") natLearn(items, pane);
  else if(natState.tab === "quiz") natQuiz(items, pane);
  else natSay(items, pane);
  wireSpeak(app);
}
function natCard(p){
  return `<li class="phr">
    <div class="phr-top"><b class="phr-ph">${esc(p.pat)}</b><span class="pill k-p">${p.lv}</span><span class="pill reg-${p.reg}">${p.reg}</span>${natDots(p)}</div>
    <p class="phr-m">${esc(p.use)}</p>
    <p class="frame-inline phr-ex">${natEx(p)}</p>
    ${listenHTML(p.exs[0])}
    ${p.exs[1] ? `<p class="frame-inline phr-ex2"><button class="icon-btn speak" data-say="${esc(p.exs[1])}" aria-label="Listen to the second example">▶</button> ${esc(p.exs[1])}</p>` : ""}
  </li>`;
}
function natLearn(items, pane){
  const groups = natState.cat === "all" ? NCATS.filter(c => items.some(p => p.cat === c[0])) : [[natState.cat, catName(natState.cat)]];
  pane.innerHTML = groups.map(([id, name]) => `<section><h2 class="h3">${esc(name)}</h2><ul class="phr-list">${items.filter(p => p.cat === id).map(natCard).join("")}</ul></section>`).join("") +
    `<div class="next-row"><button class="btn primary" id="n-go-quiz">Practise these →</button></div>`;
  $("#n-go-quiz", pane).onclick = () => { natState.tab = "quiz"; natState.quiz = null; renderNatural(); window.scrollTo({top:0, behavior:"smooth"}); };
}
function buildNatQuiz(items){
  const now = Date.now(), st = p => S.nat[p.id] || {box:0, due:0};
  const pick = [...shuffle(items.filter(p => st(p).box > 0 && st(p).due <= now)), ...shuffle(items.filter(p => !st(p).box)), ...items.filter(p => st(p).box > 0 && st(p).due > now).sort((a, b) => st(a).box - st(b).box)].slice(0, 10);
  return shuffle(pick).map(p => Math.random() < 0.5
    ? {p, type:"natural", right:p.exs[0], opts:shuffle([p.exs[0], p.stiff, p.err])}
    : {p, type:"gap", right:p.a, opts:shuffle([p.a, ...p.d])});
}
function natQuiz(items, pane){
  let q = natState.quiz;
  const key = natState.cat + "|" + natState.lv;
  if(!q || q.key !== key) q = natState.quiz = {key, qs:buildNatQuiz(items), i:0, score:0, answered:false, missed:[]};
  if(q.i >= q.qs.length){
    pane.innerHTML = `<section class="panel"><p class="qtype">Round complete</p><p class="done-score">${q.score} / ${q.qs.length}</p>
      ${q.missed.length ? `<h3 class="h4">Review these</h3><ul class="phr-miss">${q.missed.map(p => `<li><b>${esc(p.pat)}</b> <span class="muted">· ${esc(p.use)}</span><br><span class="frame-inline">${esc(p.exs[0])}</span></li>`).join("")}</ul>` : '<p class="muted">Every answer right. These patterns will come back for review later.</p>'}
      <div class="row" style="margin-top:16px"><button class="btn" id="nq-again">Another round</button><button class="btn primary" id="nq-say">Say ${q.missed.length ? "the ones you missed" : "them"} naturally →</button></div></section>`;
    $("#nq-again", pane).onclick = () => { natState.quiz = null; renderNatural(); };
    $("#nq-say", pane).onclick = () => { const list = (q.missed.length ? q.missed : q.qs.map(x => x.p)); natState.tr = {queue:list.map(p => p.id), i:0}; natState.tab = "say"; renderNatural(); };
    return;
  }
  const cur = q.qs[q.i], p = cur.p;
  pane.innerHTML = `<section class="panel">
    <div class="dots" aria-hidden="true">${q.qs.map((_, k) => `<span class="dot ${k < q.i ? "done" : ""} ${k === q.i ? "cur" : ""}"></span>`).join("")}<span class="muted">Question ${q.i + 1} of ${q.qs.length}</span></div>
    ${cur.type === "natural"
      ? `<p class="qtype">Which sounds most natural?</p><p class="qtext" style="font-size:17px">${esc(p.use)}</p>`
      : `<p class="qtype">Complete the phrase · ${esc(p.pat)}</p><p class="qtext frame-inline">${esc(p.exs[0].replace(blankRe(p.a), "$1§§")).replace("§§", '<span class="blank">_____</span>')}</p>`}
    <div class="opts">${cur.opts.map(o => `<button class="opt${cur.type === "natural" ? " serif" : ""}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="nqfb" class="qfb" aria-live="polite"></div>
    <div class="next-row" style="margin-top:18px"><button class="btn primary" id="nq-next" disabled>${q.i + 1 === q.qs.length ? "See result" : "Next question"} →</button></div>
  </section>`;
  const fb = $("#nqfb", pane), nx = $("#nq-next", pane);
  pane.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(q.answered) return;
    q.answered = true;
    const ok = b.dataset.o === cur.right;
    pane.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x.dataset.o === cur.right) x.classList.add("right"); });
    if(!ok){ b.classList.add("wrong"); q.missed.push(p); } else q.score++;
    natMark(p, ok);
    fb.className = "qfb " + (ok ? "ok" : "no");
    fb.innerHTML = `<b>${ok ? "Correct." : "Not quite."}</b> <b>${esc(p.pat)}</b>: ${esc(p.use)}
      ${cur.type === "natural" ? `<ul class="tips" style="margin-top:8px"><li><b>Natural:</b> ${esc(p.exs[0])}</li><li><b>Too formal:</b> <span class="muted">${esc(p.stiff)}</span></li><li><b>Common mistake:</b> <span class="muted">${esc(p.err)}</span></li></ul>` : ""}
      <p class="frame-inline" style="margin:8px 0">${natEx(p)}</p>${listenHTML(p.exs[0])}`;
    wireSpeak(fb);
    nx.disabled = false; nx.focus();
  });
  nx.onclick = () => { q.i++; q.answered = false; renderNatural(); };
}
function sayPrompt(p, text){
  return `A C1-level English learner was asked to say a stiff, textbook sentence the way a native speaker would at work, using the pattern "${p.pat}" (${p.use}).
Textbook sentence: "${p.stiff}"
Their answer (spoken with speech-to-text, so ignore punctuation and capital letters):
"""${text}"""

Judge whether they used the pattern correctly, how natural it sounds, and any grammar problems. Be encouraging and specific.
Return ONLY JSON with exactly this shape:
{"used":true|false,"natural":<1-5, where 5 sounds fully native>,"comment":"<max 25 words>","fixed":"<their answer corrected and made natural, keeping their words where possible>","model":"<one natural way a native speaker would say it, using the pattern>"}`;
}
function natSay(items, pane){
  let T = natState.tr;
  if(!T || !T.queue || !T.queue.length){
    const st = p => S.nat[p.id] || {box:0};
    const ordered = [...shuffle(items.filter(p => st(p).box > 0 && st(p).box < 3)), ...shuffle(items.filter(p => !st(p).box)), ...shuffle(items.filter(p => st(p).box >= 3))];
    T = natState.tr = {queue:ordered.map(p => p.id), i:0};
  }
  if(T.i >= T.queue.length) T.i = 0;
  const p = NAT.find(x => x.id === T.queue[T.i]);
  pane.innerHTML = `<section class="panel">
    <p class="qtype">Say it naturally · ${T.i + 1} of ${T.queue.length}</p>
    <p class="muted" style="margin:0 0 4px;font-size:14px">Textbook version</p>
    <p class="stiff">${esc(p.stiff)}</p>
    <p style="margin:14px 0 4px">Say it the way a native speaker would, using <b>${esc(p.pat)}</b></p>
    <p class="muted" style="margin:0 0 12px;font-size:14px">${esc(p.use)}</p>
    <label for="nat-in" class="lbl">Your version</label>
    <textarea id="nat-in" rows="3" placeholder="Tap Speak and say it, or type.">${esc(T.text || "")}</textarea>
    <div class="row">
      <button class="btn" id="nat-show" type="button">Show a natural version</button>
      <span class="spacer"></span>
      <button class="btn mic-btn" id="nat-mic" type="button">${MIC_SVG}<span>Speak</span></button>
      <button class="btn primary ai-only" id="nat-check" type="button">Check</button>
    </div>
    <p class="muted no-ai-note" style="margin:10px 0 0">Add your Claude API key in <a href="#settings">Settings</a> to get your version checked. Without it, compare with the natural version.</p>
  </section>
  <div id="nat-out"></div>
  <div class="next-row"><button class="btn" id="nat-next">Next sentence →</button></div>`;
  const ta = $("#nat-in", pane), out = $("#nat-out", pane), mic = $("#nat-mic", pane);
  ta.addEventListener("input", () => { T.text = ta.value; });
  $("#nat-next", pane).onclick = () => { T.i++; T.text = ""; renderNatural(); };
  $("#nat-show", pane).onclick = () => {
    out.innerHTML = `<section class="panel"><h2 class="h3">Natural versions</h2>${p.exs.map(x => `<p class="frame-inline sayback">${pronHTML(x)}</p>${listenHTML(x)}`).join('<div style="height:12px"></div>')}</section>`;
    wireSpeak(out);
  };
  if(!SR) mic.remove();
  else mic.onclick = () => {
    if(Mic.active && Mic.owner === mic){ micStop(false); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    micStart({owner:mic, base:"", autoSendMs:0,
      onUpdate:() => { ta.value = (Mic.text + " " + Mic.interim).trim(); T.text = ta.value; mic.classList.toggle("listening", Mic.active); mic.lastChild.textContent = Mic.active ? "Stop" : "Speak"; },
      onDone:(t, s, conf, err) => { ta.value = t; T.text = t; mic.classList.remove("listening"); mic.lastChild.textContent = "Speak"; if(err) out.innerHTML = `<div class="panel err">${esc(micErrText(err))}</div>`; }});
  };
  $("#nat-check", pane).onclick = async () => {
    const text = ta.value.trim();
    if(wordsOf(text).length < 3){ out.innerHTML = '<div class="panel err">Say or type your version first.</div>'; return; }
    if(Mic.active) micStop(false);
    const btn = $("#nat-check", pane); btn.disabled = true;
    out.innerHTML = '<section class="panel"><p class="muted" style="margin:0">Checking…</p></section>';
    try{
      const v = await askJSON(sayPrompt(p, text));
      const score = Math.max(1, Math.min(5, Math.round(+v.natural || 0)));
      natMark(p, !!v.used && score >= 4);

  if(code === "rate_limited") return "Too many messages in a short time. Wait a minute, then send again.";
  if(code === "no_key") return "Add your Claude API key in Settings to use the AI features.";
  if(code === "bad_key") return "Your Claude API key was rejected. Check it in Settings.";
  if(code === "credit") return "Your Claude API account is out of credit. Add credit at console.anthropic.com, then try again.";
  if(code === "overloaded") return "Claude is busy right now. Wait a few seconds and send again.";
  if(code === "network") return "No internet connection. Check your connection and send again.";

}

The learner typed or dictated the message with speech-to-text, so ignore missing punctuation and capital letters. If a word looks like a dictation mishearing (a real word that doesn't fit the context, such as "sheep" for "ship" or "walk" for "work"), add it to "pronunciation" with the word they probably meant and the sound to work on.

${transcript(c, c.msgs.length - 1)}

Learner's latest message: """${text}"""${conf ? `

async function sendTurn(text, conf){
  const me = {role:"me", text, pending:true, conf:conf || null};
  chat.msgs.push(me); chat.busy = true; chat.streaming = null; chat.replied = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  drawChat(true);
  S.attempts.push({card:"AI", text, at:Date.now(), wc:wordsOf(text).length}); S.attempts = S.attempts.slice(-80); persist();
  const mine = chat;
  const here = () => chat === mine && location.hash === "#partner";
  const onReply = r => {
    if(mine.replied) return;
    mine.replied = true; mine.streaming = null;
    mine.msgs.push({role:"partner", text:r});
    if(here()){ drawChat(true); speakReply(mine, r); }
  };
  try{
    const res = await claudeCall(partnerPrompt(mine, text, conf), {maxTokens:1400, onText: full => {
      if(mine.replied) return;
      const a = full.indexOf("<reply>"); if(a < 0) return;
      const b = full.indexOf("</reply>", a);
      if(b < 0){
        mine.streaming = full.slice(a + 7).replace(/<\/?r?e?p?l?y?$/, "");
        const el = document.getElementById("pv-stream");
        if(el && here()) el.textContent = mine.streaming; else if(here()) drawChat(true);
        return;
      }
      onReply(full.slice(a + 7, b).trim());
    }});
    const full = res.text || "";
    if(!mine.replied){
      let r = ""; const m = full.match(/<reply>([\s\S]*?)<\/reply>/);
      if(m) r = m[1].trim(); else { try{ const j = parseJSON(full); r = String(j.reply || ""); }catch(e){} }
      if(r) onReply(r);
    }
    let fb = {};
    const fm = full.match(/<feedback>([\s\S]*?)(?:<\/feedback>|$)/);
    try{ fb = parseJSON(fm ? fm[1] : full); if(fb && fb.feedback && typeof fb.feedback === "object") fb = fb.feedback; }catch(e){ fb = {}; }
    me.pending = false; me.fb = fb; mine.busy = false; mine.streaming = null;
    if(here()) drawChat(false);
    if(!mine.replied){ me.err = "Your partner's answer came back empty. Try sending again."; if(here()) drawChat(true); }
  }catch(e){
    me.pending = false; me.err = aiError(e); mine.busy = false; mine.streaming = null;
    if(here()) drawChat(true);
  }
}

}
function reportHTML(r){
  const cards = arr(r.cards).map(x => CARDS.find(c => c.id === String(x).trim().toUpperCase())).filter(Boolean);
  return `<section class="panel report">
    <div class="fb-head"><h2 class="h3">Conversation debrief</h2>${r.level ? `<span class="pill lvl-ok">${esc(r.level)}</span>` : ""}</div>
    ${r.summary ? `<p style="margin:0 0 6px;max-width:70ch">${esc(r.summary)}</p>` : ""}
    ${arr(r.strengths).length ? `<h3 class="h4">What went well</h3><ul class="tips">${arr(r.strengths).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${arr(r.focus).length ? `<h3 class="h4">Work on next</h3><table class="vocab"><thead><tr><th>Area</th><th>You said</th><th>Try</th></tr></thead><tbody>${arr(r.focus).map(f => `<tr><td><b>${esc(f.area)}</b></td><td><s>${esc(f.example)}</s></td><td>${esc(f.better)}</td></tr>`).join("")}</tbody></table>` : ""}
    ${arr(r.words).length ? `<h3 class="h4">Words to practise saying</h3><ul class="ptips">${arr(r.words).map(w => `<li><button class="chip speak" data-say="${esc(w.word)}" data-rate="0.85">${esc(w.word)} <span class="mipa">/${fmtIPA(PRON.ipa[String(w.word || "").toLowerCase()] || String(w.ipa || "").replace(/[\/\[\]]/g, ""))}/</span></button> <span class="muted">${esc(w.tip)}</span></li>`).join("")}</ul>` : ""}
    ${cards.length ? `<h3 class="h4">Cards to review</h3><div class="chips">${cards.map(c => `<a class="chip" href="${cardHref(c)}">Card ${c.id} · ${esc(c.t)}</a>`).join("")}</div>` : ""}
    ${r.next ? `<p class="note"><b>Next conversation:</b> ${esc(r.next)}</p>` : ""}
    <div class="next-row" style="margin-top:16px"><button class="btn" id="pv-again">Same situation again</button><button class="btn primary" id="pv-other">Choose another situation</button></div>
  </section>`;
}
document.addEventListener("click", e => {
  const t = e.target;
  if(t.id === "pv-again" && chat){ const s = scenOf(chat.sid); chat = {sid:s.id, level:chat.level, msgs:[{role:"partner", text:s.open}], busy:false, report:null, at:Date.now()}; renderPartner(); speakReply(chat, s.open); }
  if(t.id === "pv-other"){ chat = null; renderPartner(); window.scrollTo(0, 0); }
});

/* ---------------- routing + boot ---------------- */
function route(){
  const h = (location.hash || "").slice(1);
  if(h.startsWith("card-")){
    const c = CARDS.find(x => x.id === h.slice(5).toUpperCase());
    if(c) return renderCard(c);
  }
  if(h === "review") return renderReview();
  if(h === "radar") return renderRadar();
  if(h === "partner") return renderPartner();
  if(h === "settings") return renderSettings();
  if(h === "phrases") return renderPhrases();
  if(h === "natural") return renderNatural();
  renderLibrary();
}
window.addEventListener("hashchange", () => { try{ speechSynthesis.cancel(); }catch(e){} if(Mic.active) micStop(false); route(); window.scrollTo(0, 0); });
function applyPron(){
  document.body.classList.toggle("pr-on", pronOn);
  const t = $("#ipa-toggle"); if(t) t.setAttribute("aria-pressed", String(pronOn));
}
function start(data){
  if(data && data.drafts && typeof data.drafts === "object") Object.assign(drafts, data.drafts);
  if(data && data.chat && typeof data.chat === "object" && Array.isArray(data.chat.msgs)) chat = data.chat;
  applyPron();
  $("#ipa-toggle").onclick = () => { pronOn = !pronOn; lsSet("framework-english-ipa", pronOn); applyPron(); route(); };
  const vp = $("#voice-panel"), vbtn = $("#voice-btn");
  if(!("speechSynthesis" in window)){ vbtn.hidden = true; }
  vbtn.onclick = () => { const open = vp.hidden; vp.hidden = !open; vbtn.setAttribute("aria-expanded", String(open)); if(open) loadVoices(); };
  $("#voice-sel").onchange = e => { voicePref = e.target.value; lsSet("framework-english-voice", voicePref); renderVoicePanel(); speak("Hi! This is how I sound. Let's practise together.", 1); };
  $("#voice-test").onclick = () => speak("I can see why that's appealing. What concerns me is the risk to quality. Could we perhaps look at another option?", 1);
  renderVoicePanel();
  initSample();
  route();
  initDb();
  const ib = $("#install-btn");
  ib.onclick = async () => { if(!deferredInstall) return; deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(e){} deferredInstall = null; ib.hidden = true; };
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({drafts, chat: chat ? JSON.parse(JSON.stringify(Object.assign({}, chat, {busy:false}))) : null})); }catch(e){}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
